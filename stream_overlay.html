<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupAshh — Stream Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
  }

  .game-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(88, 0, 255, 0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(0, 200, 255, 0.08) 0%, transparent 60%),
      linear-gradient(180deg, #0d0d1a 0%, #0a0a0f 100%);
    z-index: 0;
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
  }

  /* === COUNTDOWN - GLASS BAR === */
  .countdown-bar-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    text-align: center;
    width: 520px;
  }

  .countdown-glass {
    background: rgba(10, 10, 20, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(120, 60, 255, 0.12);
    border-radius: 16px;
    padding: 36px 50px 30px;
    box-shadow:
      0 0 60px rgba(120, 60, 255, 0.04),
      inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .countdown-time {
    color: #fff;
    font-size: 80px;
    font-weight: 800;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 50px rgba(120, 60, 255, 0.2);
    line-height: 1;
  }

  .countdown-label {
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .countdown-bar-track {
    position: relative;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 2px;
    margin-top: 22px;
    overflow: hidden;
  }

  .countdown-bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #783cff, #00c8ff);
    transition: width 1s linear;
    box-shadow: 0 0 12px rgba(120, 60, 255, 0.2);
  }

  .channel-name {
    margin-top: 16px;
    color: rgba(255,255,255,0.06);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .channel-name strong { color: rgba(255,255,255,0.12); font-weight: 800; }

  /* === BOTTOM BAR === */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 80px;
    background: linear-gradient(180deg, rgba(10,10,15,0) 0%, rgba(10,10,15,0.85) 30%, rgba(10,10,15,0.95) 100%);
    z-index: 10;
    display: flex;
    align-items: flex-end;
    padding: 0 40px 12px 40px;
    gap: 30px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }

  .bar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .bar-item .icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .bar-item .value {
    color: #fff;
    font-weight: 700;
    font-size: 16px;
  }

  .spacer { flex: 1; }

  /* === WEBCAM FRAME === */
  .webcam-wrap {
    position: absolute;
    bottom: 100px;
    right: 30px;
    z-index: 20;
  }

  .webcam-frame {
    width: 340px;
    height: 220px;
    border: 2px solid rgba(120, 60, 255, 0.5);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    background: #12121f;
    box-shadow:
      0 0 30px rgba(120, 60, 255, 0.12),
      inset 0 0 40px rgba(0,0,0,0.5);
  }

  .webcam-frame::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 10px;
    padding: 2px;
    background: linear-gradient(135deg, rgba(120,60,255,0.4), transparent 40%, transparent 60%, rgba(0,200,255,0.3));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .webcam-label {
    position: absolute;
    bottom: 8px;
    left: 10px;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.6);
    padding: 2px 8px;
    border-radius: 4px;
  }

  .cam-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.08);
    font-size: 48px;
  }

  /* === TERMINAL - PURPLE/CYAN THEME === */
  .term-panel {
    position: absolute;
    bottom: 100px;
    left: 30px;
    z-index: 20;
    width: 420px;
    height: 230px;
    background: rgba(10, 10, 25, 0.6);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(120, 60, 255, 0.12);
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 30px rgba(120, 60, 255, 0.03),
      inset 0 0 40px rgba(0,0,0,0.3);
  }

  .term-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(120, 60, 255, 0.06);
    background: rgba(0,0,0,0.15);
  }

  .term-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .term-dot.purple { background: #783cff; }
  .term-dot.cyan { background: #00c8ff; box-shadow: 0 0 6px rgba(0,200,255,0.3); }
  .term-dot.dim { background: rgba(255,255,255,0.06); }

  .term-title {
    color: rgba(255,255,255,0.12);
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-left: auto;
  }

  .term-body {
    padding: 8px 14px 10px;
    height: 180px;
    overflow: hidden;
    position: relative;
    font-family: 'Courier New', monospace;
  }

  .term-line {
    font-size: 12px;
    line-height: 1.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    animation: termFade 0.3s ease-out forwards;
    opacity: 0;
  }

  @keyframes termFade {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .term-line .t-purple { color: rgba(120, 60, 255, 0.8); }
  .term-line .t-cyan { color: rgba(0, 200, 255, 0.75); }
  .term-line .t-pink { color: rgba(255, 80, 150, 0.7); }
  .term-line .t-gold { color: rgba(255, 200, 50, 0.65); }
  .term-line .t-white { color: rgba(255,255,255,0.55); }
  .term-line .t-dim { color: rgba(255,255,255,0.2); }
  .term-line .t-prompt { color: rgba(120, 60, 255, 0.35); }

  .term-cursor {
    display: inline-block;
    width: 6px;
    height: 13px;
    background: rgba(120, 60, 255, 0.3);
    animation: termBlink 0.8s step-end infinite;
    vertical-align: middle;
    margin-left: 3px;
  }

  @keyframes termBlink { 50% { opacity: 0; } }

  /* === SOCIAL BAR === */
  .social-bar {
    position: absolute;
    top: 30px;
    right: 30px;
    z-index: 20;
    display: flex;
    gap: 10px;
  }

  .social-icon {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.35);
    font-size: 15px;
    font-weight: 700;
    transition: all 0.2s;
    text-decoration: none;
  }

  .social-icon:hover {
    border-color: rgba(120, 60, 255, 0.25);
    background: rgba(120, 60, 255, 0.06);
    color: #fff;
  }

  /* === NOW PLAYING === */
  .now-playing {
    position: absolute;
    top: 30px;
    left: 30px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(10,10,15,0.6);
    backdrop-filter: blur(8px);
    padding: 8px 16px 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
    max-width: 360px;
  }

  .np-bar {
    width: 3px;
    height: 28px;
    border-radius: 2px;
    background: linear-gradient(180deg, #783cff, #00c8ff);
    animation: pulseBar 1s ease-in-out infinite;
  }

  @keyframes pulseBar {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .np-info { overflow: hidden; }

  .np-label {
    color: rgba(255,255,255,0.3);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .np-song {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .np-artist {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
  }

  /* === GOAL / PROGRESS === */
  .goal-wrap {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 30px;
    background: rgba(10,10,15,0.5);
    backdrop-filter: blur(6px);
    padding: 10px 28px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .goal-item { text-align: center; }

  .goal-label {
    color: rgba(255,255,255,0.3);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .goal-value {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }

  .goal-sub {
    color: rgba(255,255,255,0.3);
    font-size: 11px;
  }
</style>
</head>
<body>

<div class="game-bg"></div>
<div class="grid-overlay"></div>

<!-- COUNTDOWN - GLASS BAR -->
<div class="countdown-bar-wrap">
  <div class="countdown-glass">
    <div class="countdown-time" id="timerDisplay">5:00</div>
    <div class="countdown-label">Starting Soon</div>
    <div class="countdown-bar-track">
      <div class="countdown-bar-fill" id="barFill"></div>
    </div>
  </div>
  <div class="channel-name">twitch.tv/<strong>SupAshh</strong></div>
</div>

<!-- GOALS -->
<div class="goal-wrap">
  <div class="goal-item">
    <div class="goal-label">Followers</div>
    <div class="goal-value">50</div>
    <div class="goal-sub">/ 100</div>
  </div>
  <div class="goal-item">
    <div class="goal-label">Subs</div>
    <div class="goal-value">24</div>
    <div class="goal-sub">/ 50</div>
  </div>
  <div class="goal-item">
    <div class="goal-label">Uptime</div>
    <div class="goal-value">2:34</div>
    <div class="goal-sub">hours</div>
  </div>
</div>

<!-- NOW PLAYING -->
<div class="now-playing">
  <div class="np-bar"></div>
  <div class="np-info">
    <div class="np-label">Now Playing</div>
    <div class="np-song">Midnight City</div>
    <div class="np-artist">M83</div>
  </div>
</div>

<!-- SOCIAL -->
<div class="social-bar">
  <a class="social-icon" href="https://twitch.tv/SupAshh" target="_blank" title="Twitch">Tw</a>
  <a class="social-icon" href="#" target="_blank" title="Twitter/X">X</a>
  <a class="social-icon" href="#" target="_blank" title="Discord">Dc</a>
  <a class="social-icon" href="#" target="_blank" title="YouTube">YT</a>
  <a class="social-icon" href="#" target="_blank" title="Instagram">Ig</a>
</div>

<!-- TERMINAL -->
<div class="term-panel">
  <div class="term-header">
    <div class="term-dot purple"></div>
    <div class="term-dot cyan"></div>
    <div class="term-dot dim"></div>
    <div class="term-title">terminal://supashh</div>
  </div>
  <div class="term-body" id="termBody"></div>
</div>

<!-- WEBCAM -->
<div class="webcam-wrap">
  <div class="webcam-frame">
    <div class="cam-placeholder">◉</div>
    <div class="webcam-label">SupAshh — Live</div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="bar-item">
    <span class="icon" style="background:rgba(145,70,255,0.15);color:#9146ff;">●</span>
    <span class="value">LIVE</span>
  </div>

  <div class="bar-item">
    <span class="icon" style="background:rgba(255,255,255,0.05);">👤</span>
    <span class="value">124</span>
    viewers
  </div>

  <div class="spacer"></div>

  <div class="bar-item">
    chat
    <span class="icon" style="background:rgba(255,255,255,0.05);font-size:16px;">💬</span>
  </div>

  <div class="bar-item">
    stream
    <span class="icon" style="background:rgba(255,255,255,0.05);font-size:16px;">⚙</span>
  </div>
</div>

<script>
(function() {
  const TOTAL_SECS = 300;
  const timerEl = document.getElementById('timerDisplay');
  const barEl = document.getElementById('barFill');
  let remaining = TOTAL_SECS;

  function pad(n) { return n.toString().padStart(2, '0'); }

  function updateDisplay() {
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    timerEl.textContent = mins + ':' + pad(secs);
    barEl.style.width = (remaining / TOTAL_SECS * 100) + '%';

    if (remaining <= 0) {
      remaining = TOTAL_SECS;
      updateDisplay();
    }
  }

  updateDisplay();
  setInterval(function() { remaining--; updateDisplay(); }, 1000);
})();

(function() {
  const body = document.getElementById('termBody');
  const maxLines = 10;

  const lines = [
    { t: 'stream_daemon v3.1.8 — initializing', c: 't-dim' },
    { t: 'auth.sys → handshake twitch.tv/SupAshh', c: 't-white' },
    { t: 'ACCESS GRANTED [token: 0x7F::3A4B]', c: 't-purple' },
    { t: 'relay connected 192.168.1.45:8080', c: 't-cyan' },
    { t: 'decrypt payload.. 87% — node_alpha', c: 't-gold' },
    { t: 'FOLLOW +1 :: PixelWarrior [12s ago]', c: 't-purple' },
    { t: 'SUBSCRIBE :: NovaStrike [Tier 1]', c: 't-cyan' },
    { t: 'DONATION +$5.00 :: ShadowByte', c: 't-gold' },
    { t: 'RAID incoming :: 24 viewers [CyberPunk_99]', c: 't-pink' },
    { t: 'chat buffer: 1,204 msgs/min', c: 't-white' },
    { t: 'latency 34ms — all nominal', c: 't-purple' },
    { t: 'cache hit ratio 97.3%', c: 't-cyan' },
    { t: 'WARN packet loss 0.02%', c: 't-gold' },
    { t: 'sync clock → ntp.pool.org OK', c: 't-dim' },
    { t: 'stream status :: LIVE — 124 viewers', c: 't-purple' },
    { t: 'tts engine ready — 3 voices', c: 't-cyan' },
    { t: 'monitoring chat for commands', c: 't-white' },
    { t: 'heartbeat 200 OK — 1.2s interval', c: 't-dim' },
    { t: 'firewall status: all ports secure', c: 't-purple' },
    { t: 'uptime 2h 34m — no errors', c: 't-cyan' },
  ];

  let idx = 0;

  function addLine() {
    const entry = lines[idx % lines.length];
    idx++;
    const div = document.createElement('div');
    div.className = 'term-line';
    div.innerHTML = '<span class="t-prompt">❯</span> <span class="' + entry.c + '">' + entry.t + '</span>';
    body.appendChild(div);
    if (body.children.length > maxLines) body.removeChild(body.firstChild);
    body.scrollTop = body.scrollHeight;
  }

  for (let i = 0; i < 6; i++) addLine();
  setInterval(addLine, 3500);
})();
</script>

</body>
</html>
