org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx4096M -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=false
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.nonTransitiveRClass=true

# Performance
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Suppress deprecated
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Timeouts for JitPack
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Caching
org.gradle.caching=true

# KSP
ksp.incremental=true
