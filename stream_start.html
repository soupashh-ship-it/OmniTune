<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Min Countdown</title>
    <style>
        body {
            background: linear-gradient(90deg, #0047AB 0%, #0E36B4 100%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .countdown {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            width: fit-content;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="countdown">5:00</div>

    <!-- Include a script to update the countdown -->
    <script>
        let minutes = 5;
        function updateTime() {
            if (minutes > 0) {
                minutes -= 1;
            }
            document.querySelector('.countdown').textContent = `${minutes}:${(60 - (Date.now() % 60000)) / 1000 | 0}.0`;
            setTimeout(updateTime, 1000);
        }
        updateTime();
    </script>
</body>
</html>
