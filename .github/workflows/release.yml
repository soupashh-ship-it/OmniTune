name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify tests and lint
        env:
          YOUTUBE_MUSIC_API_KEY: ${{ secrets.YOUTUBE_MUSIC_API_KEY }}
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintRelease

      - name: Decode release keystore
        env:
          OMNITUNE_KEYSTORE_BASE64: ${{ secrets.OMNITUNE_KEYSTORE_BASE64 }}
        run: |
          test -n "$OMNITUNE_KEYSTORE_BASE64"
          echo "$OMNITUNE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omnitune-release.jks"

      - name: Build signed release APK
        env:
          OMNITUNE_KEYSTORE_FILE: ${{ runner.temp }}/omnitune-release.jks
          OMNITUNE_KEYSTORE_PASSWORD: ${{ secrets.OMNITUNE_KEYSTORE_PASSWORD }}
          OMNITUNE_KEY_ALIAS: ${{ secrets.OMNITUNE_KEY_ALIAS }}
          OMNITUNE_KEY_PASSWORD: ${{ secrets.OMNITUNE_KEY_PASSWORD }}
          YOUTUBE_MUSIC_API_KEY: ${{ secrets.YOUTUBE_MUSIC_API_KEY }}
        run: ./gradlew assembleRelease

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          APK_SOURCE="$(find app/build/outputs/apk/release -type f -name '*release*.apk' ! -name '*unsigned*' ! -name '*debug*' | head -n 1)"
          test -n "$APK_SOURCE"

          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"
          APK_NAME="OmniTune-${TAG_NAME}-release.apk"
          APK_PATH="$ASSET_DIR/$APK_NAME"
          SHA_PATH="$APK_PATH.sha256"

          cp "$APK_SOURCE" "$APK_PATH"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK_PATH"
          (cd "$ASSET_DIR" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha_path=$SHA_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=".github/release-notes-${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "OmniTune ${GITHUB_REF_NAME}" --notes-file "$NOTES_FILE"
            fi
            exit 0
          fi
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --title "OmniTune ${GITHUB_REF_NAME}" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" --title "OmniTune ${GITHUB_REF_NAME}" --notes "Signed OmniTune release build."
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.assets.outputs.apk_path }}" \
            "${{ steps.assets.outputs.sha_path }}" \
            --clobber

      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/omnitune-release.jks"
