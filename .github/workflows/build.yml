name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      env:
        YOUTUBE_MUSIC_API_KEY: ${{ secrets.YOUTUBE_MUSIC_API_KEY }}
      run: ./gradlew testDebugUnitTest :app:koverHtmlReport --stacktrace

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: app/build/reports/kover/

    - name: Run Lint
      env:
        YOUTUBE_MUSIC_API_KEY: ${{ secrets.YOUTUBE_MUSIC_API_KEY }}
      run: ./gradlew lintDebug lintRelease --stacktrace

    - name: Compile Android tests
      env:
        YOUTUBE_MUSIC_API_KEY: ${{ secrets.YOUTUBE_MUSIC_API_KEY }}
      run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

    - name: Build Debug APK
      env:
        YOUTUBE_MUSIC_API_KEY: ${{ secrets.YOUTUBE_MUSIC_API_KEY }}
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
