name: Android Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode release keystore
      env:
        OMNITUNE_KEYSTORE_BASE64: ${{ secrets.OMNITUNE_KEYSTORE_BASE64 }}
      run: |
        test -n "$OMNITUNE_KEYSTORE_BASE64"
        echo "$OMNITUNE_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

    - name: Build Release APK
      env:
        OMNITUNE_KEYSTORE_FILE: app/release-keystore.jks
        OMNITUNE_KEYSTORE_PASSWORD: ${{ secrets.OMNITUNE_KEYSTORE_PASSWORD }}
        OMNITUNE_KEY_ALIAS: ${{ secrets.OMNITUNE_KEY_ALIAS }}
        OMNITUNE_KEY_PASSWORD: ${{ secrets.OMNITUNE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
