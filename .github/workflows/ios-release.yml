name: iOS Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.6.0)"
        required: true
        default: "v1.6.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Application Archive
        run: |
          set -e
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "Building iOS App for tag: $TAG"
          
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa and calculate checksum
        run: |
          set -e
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          IPA_NAME="OmniTune-${TAG}-ios.ipa"
          
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications/iosApp.app" "$RUNNER_TEMP/Payload/"
          
          cd "$RUNNER_TEMP"
          zip -qr "$IPA_NAME" Payload
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          
          echo "IPA_PATH=$RUNNER_TEMP/$IPA_NAME" >> $GITHUB_ENV
          echo "SHA_PATH=$RUNNER_TEMP/$IPA_NAME.sha256" >> $GITHUB_ENV
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload iOS Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "Uploading $IPA_NAME and checksum to release $TAG"
          gh release upload "$TAG" "$IPA_PATH" "$SHA_PATH" --repo "$GITHUB_REPOSITORY" --clobber
